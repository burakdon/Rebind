[project]
name = "rebind"
version = "0.1.0"
description = "Read a whole book without destroying it, and render it as a 3D landscape where every element traces back to the passage it came from."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.50",
    "pydantic>=2.7",
]

[project.scripts]
rebind = "rebind.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rebind"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["src"]
