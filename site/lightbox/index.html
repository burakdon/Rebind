<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rebind · Lightbox study</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #08090a; overflow: hidden; color: #e9dcc0;
    font-family: "IM Fell English", Georgia, serif; }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; }
  #plaque { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); text-align: center;
    pointer-events: none; text-shadow: 0 1px 8px #000; width: min(680px, calc(100vw - 32px)); }
  #plaque h1 { font-family: "IM Fell English SC", serif; font-weight: 400; font-size: 22px; letter-spacing: 0.12em;
    margin: 0; }
  #plaque p { margin: 3px 0 0; font-style: italic; font-size: 15px; color: #b9a887; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="stage"></div>
<div id="plaque">
  <h1 id="cap-title">Pride and Prejudice</h1>
  <p id="cap-sub">Sixty-one leaves of cut paper, one for each chapter. Move to look around; scroll to walk in.</p>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
